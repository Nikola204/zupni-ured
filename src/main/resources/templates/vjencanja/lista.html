<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/stranica :: stranica(~{::title}, ~{::main})}">
<head><title>Vjenčanja</title></head>
<body>
<main id="sadrzaj" class="app-content">
<h1>Vjenčanja</h1>
<a th:href="@{/vjencanja/novi}" class="btn btn-primary">Dodaj vjenčanje</a>
<form th:action="@{/vjencanja}" method="get" class="filter-form">
    <label for="pretraga" class="form-label">Ime ili prezime mladenaca, broj ili godina matice:</label>
    <input id="pretraga" name="pretraga" type="search" th:value="${pretraga}" class="form-control">
    <button type="submit" class="btn btn-primary">Pretraži</button>
    <a th:href="@{/vjencanja}" class="btn btn-outline-secondary">Prikaži sve</a>
</form>
<p th:if="${vjencanja.isEmpty()}">Nema vjenčanja za prikaz.</p>
<div class="table-responsive" tabindex="0" role="region" aria-label="Pregled evidencije"><table class="table table-striped table-hover align-middle" th:unless="${vjencanja.isEmpty()}">
<thead><tr><th scope="col">Mladoženja</th><th scope="col">Nevjesta</th><th scope="col">Datum vjenčanja</th><th scope="col">Mjesto vjenčanja</th><th scope="col">Broj matice</th><th scope="col">Godina matice</th><th scope="col">Radnje</th></tr></thead>
<tbody><tr th:each="v : ${vjencanja}">
    <td th:text="${v.imeMladozenje + ' ' + v.prezimeMladozenje}"></td>
    <td th:text="${v.imeNevjeste + ' ' + v.prezimeNevjeste}"></td>
    <td th:text="${#temporals.format(v.datumVjencanja, 'dd.MM.yyyy.')}"></td>
    <td th:text="${v.mjestoVjencanja}"></td><td th:text="${v.brojMatice}"></td><td th:text="${v.godinaMatice}"></td>
    <td><a th:href="@{/vjencanja/{id}(id=${v.id})}" class="btn btn-outline-primary btn-sm">Detalji</a> <a th:href="@{/vjencanja/uredi/{id}(id=${v.id})}" class="btn btn-outline-primary btn-sm">Uredi</a></td>
</tr></tbody>
</table></div>
<a th:href="@{/}" class="btn btn-outline-secondary">Povratak na početnu</a>
</main>
</body>
</html>
