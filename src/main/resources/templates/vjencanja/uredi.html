<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/stranica :: stranica(~{::title}, ~{::main})}">
<head><title>Uređivanje vjenčanja</title></head>
<body>
<main id="sadrzaj" class="app-content">
<h1>Uređivanje vjenčanja</h1>
<form th:action="@{/vjencanja/uredi/{id}(id=${vjencanjeId})}" th:object="${vjencanje}" method="post" class="form-card">
    <div th:replace="~{vjencanja/polja :: polja}"></div>
    <button type="submit" class="btn btn-primary">Spremi vjenčanje</button>
</form>
<a th:href="@{/vjencanja}" class="btn btn-outline-secondary">Povratak na vjenčanja</a>
</main>
</body>
</html>
