<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/stranica :: stranica(~{::title}, ~{::main})}">
<head><title>Obavijest</title></head>
<body>
<main id="sadrzaj" class="app-content notice-detail">
<h1>Obavijest</h1>
<article class="card card-section">
<h2 th:text="${obavijest.naslov}"></h2>
<div class="d-flex flex-wrap align-items-center gap-3 small text-secondary mb-4">
    <span>Datum objave: <span th:text="${#temporals.format(obavijest.datumObjave, 'dd.MM.yyyy.')}"></span></span>
    <span class="badge notice-badge" th:if="${obavijest.istaknuta}">Istaknuta obavijest</span>
</div>
<div class="notice-body" th:text="${obavijest.sadrzaj}"></div>
</article>
<a th:href="@{/obavijesti}" class="btn btn-outline-primary">Povratak na obavijesti</a>
</main>
</body>
</html>
