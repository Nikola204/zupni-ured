<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/stranica :: stranica(~{::title}, ~{::main})}">
<head><title>Upravljanje obavijestima</title></head>
<body>
<main id="sadrzaj" class="app-content">
<h1>Upravljanje obavijestima</h1>
<p><a th:href="@{/admin/obavijesti/novi}" class="btn btn-primary">Dodaj obavijest</a></p>
<form th:action="@{/admin/obavijesti}" method="get" class="filter-form">
<label for="pretraga" class="form-label">Naslov ili sadržaj:</label>
<input type="search" name="pretraga" id="pretraga" th:value="${pretraga}" class="form-control">
<label for="filter" class="form-label">Prikaži:</label>
<select id="filter" name="filter" class="form-select"><option th:each="f : ${filtri}" th:value="${f}"
th:text="${f.naziv}" th:selected="${f == filter}"></option></select>
<button type="submit" class="btn btn-primary">Pretraži</button>
<a th:href="@{/admin/obavijesti}" class="btn btn-outline-secondary">Prikaži sve</a>
</form>
<p th:if="${obavijesti.isEmpty()}">Nema obavijesti za prikaz.</p>
<div class="table-responsive" tabindex="0" role="region" aria-label="Pregled evidencije"><table class="table table-striped table-hover align-middle" th:unless="${obavijesti.isEmpty()}">
<thead><tr><th scope="col">Naslov</th><th scope="col">Datum objave</th><th scope="col">Datum isteka</th><th scope="col">Aktivna</th><th scope="col">Istaknuta</th><th scope="col">Radnje</th></tr></thead>
<tbody><tr th:each="o : ${obavijesti}">
<td th:text="${o.naslov}"></td>
<td th:text="${#temporals.format(o.datumObjave, 'dd.MM.yyyy.')}"></td>
<td th:text="${o.datumIsteka != null ? #temporals.format(o.datumIsteka, 'dd.MM.yyyy.') : '—'}"></td>
<td ><span class="badge" th:classappend="${o.aktivna ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${o.aktivna ? 'Da' : 'Ne'}"></span></td><td th:text="${o.istaknuta ? 'Da' : 'Ne'}"></td>
<td><a th:href="@{/admin/obavijesti/{id}(id=${o.id})}" class="btn btn-outline-primary btn-sm">Detalji</a>
<a th:href="@{/admin/obavijesti/uredi/{id}(id=${o.id})}" class="btn btn-outline-primary btn-sm">Uredi</a></td>
</tr></tbody></table></div>
<p><a th:href="@{/}" class="btn btn-outline-secondary">Povratak na početnu</a></p>
</main>
</body>
</html>
