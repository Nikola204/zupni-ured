<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/stranica :: stranica(~{::title}, ~{::main})}">
<head><title>Događaji</title></head>
<body>
<main id="sadrzaj" class="app-content">
<h1>Događaji</h1>
<a class="btn btn-primary" th:href="@{/dogadjaji/novi}">Dodaj novi događaj</a>
<p class="my-3" th:if="${dogadjaji.isEmpty()}">Trenutno nema dostupnih događaja.</p>
<div class="table-responsive" th:unless="${dogadjaji.isEmpty()}" tabindex="0" role="region" aria-label="Pregled događaja">
<table class="table table-striped table-hover align-middle">
<thead><tr><th scope="col">Naziv</th><th scope="col">Opis</th><th scope="col">Datum</th><th scope="col">Vrijeme</th><th scope="col">Lokacija</th><th scope="col">Maksimalan broj sudionika</th><th scope="col">Radnje</th></tr></thead>
<tbody><tr th:each="dogadjaj : ${dogadjaji}">
<td th:text="${dogadjaj.naziv}"></td><td th:text="${dogadjaj.opis}"></td>
<td th:text="${#temporals.format(dogadjaj.datum, 'dd.MM.yyyy.')}"></td>
<td th:text="${#temporals.format(dogadjaj.vrijeme, 'HH:mm')}"></td>
<td th:text="${dogadjaj.lokacija}"></td><td th:text="${dogadjaj.maksimalanBrojSudionika}"></td>
<td><a class="btn btn-outline-primary btn-sm" th:href="@{/dogadjaji/uredi/{id}(id=${dogadjaj.id})}">Uredi</a>
<form class="d-inline" th:action="@{/dogadjaji/obrisi/{id}(id=${dogadjaj.id})}" method="post"
      onsubmit="return confirm('Jeste li sigurni da želite obrisati ovaj događaj?');">
<button class="btn btn-outline-danger btn-sm" type="submit">Obriši</button>
</form></td>
</tr></tbody></table>
</div>
<a class="btn btn-outline-secondary" th:href="@{/}">Povratak na početnu</a>
</main>
</body>
</html>
