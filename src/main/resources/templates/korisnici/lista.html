<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/stranica :: stranica(~{::title}, ~{::main})}">
<head><title>Korisnici</title></head>
<body>
<main id="sadrzaj" class="app-content">
<h1>Korisnici sustava</h1>
<p>Djelatnici župnog ureda s pristupom aplikaciji.</p>
<a th:href="@{/korisnici/novi}" class="btn btn-primary">Dodaj korisnika</a>
<p th:if="${korisnici.isEmpty()}">Nema korisnika.</p>
<div class="table-responsive" tabindex="0" role="region" aria-label="Pregled evidencije"><table class="table table-striped table-hover align-middle" th:unless="${korisnici.isEmpty()}">
    <thead>
    <tr>
        <th scope="col">Ime</th><th scope="col">Prezime</th><th scope="col">Email</th><th scope="col">Uloga</th>
        <th scope="col">Status</th><th scope="col">Datum kreiranja</th><th scope="col">Radnje</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="korisnik : ${korisnici}">
        <td th:text="${korisnik.ime}"></td>
        <td th:text="${korisnik.prezime}"></td>
        <td th:text="${korisnik.email}"></td>
        <td th:text="${korisnik.uloga.name() == 'ADMIN' ? 'Administrator' : (korisnik.uloga.name() == 'ZUPNIK' ? 'Župnik' : 'Djelatnik')}"></td>
        <td ><span class="badge" th:classappend="${korisnik.aktivan ? 'text-bg-success' : 'text-bg-secondary'}" th:text="${korisnik.aktivan ? 'Aktivan' : 'Neaktivan'}"></span></td>
        <td th:text="${#temporals.format(korisnik.datumKreiranja, 'dd.MM.yyyy. HH:mm')}"></td>
        <td>
            <a th:href="@{/korisnici/uredi/{id}(id=${korisnik.id})}" class="btn btn-outline-primary btn-sm">Uredi</a>
            <form th:if="${korisnik.aktivan}" th:action="@{/korisnici/deaktiviraj/{id}(id=${korisnik.id})}"
                  method="post" style="display: inline;"
                  onsubmit="return confirm('Jeste li sigurni da želite deaktivirati ovog korisnika?');" class="d-inline">
                <button type="submit" class="btn btn-outline-danger">Deaktiviraj</button>
            </form>
        </td>
    </tr>
    </tbody>
</table></div>
<a th:href="@{/}" class="btn btn-outline-secondary">Povratak na početnu</a>
</main>
</body>
</html>
