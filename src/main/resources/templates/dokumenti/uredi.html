<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/stranica :: stranica(~{::title}, ~{::main})}">
<head><title>Uređivanje dokumenta</title></head>
<body>
<main id="sadrzaj" class="app-content">
<h1>Uređivanje dokumenta</h1>
<form th:action="@{/dokumenti/uredi/{id}(id=${dokumentId})}" th:object="${dokument}" method="post" class="form-card">
<div th:replace="~{dokumenti/polja :: polja}"></div>
<button type="submit" class="btn btn-primary">Spremi dokument</button>
</form>
<p><a th:href="@{/dokumenti}" class="btn btn-outline-secondary">Povratak na dokumente</a></p>
</main>
</body>
</html>
