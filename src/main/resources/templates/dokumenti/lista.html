<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/stranica :: stranica(~{::title}, ~{::main})}">
<head><title>Dokumenti</title></head>
<body>
<main id="sadrzaj" class="app-content">
<h1>Dokumenti</h1>
<p><a th:href="@{/dokumenti/novi}" class="btn btn-primary">Novi zahtjev</a></p>
<form th:action="@{/dokumenti}" th:object="${dokumentFilter}" method="get" class="filter-form">
<label for="pretraga" class="form-label">Primatelj ili svrha:</label><input id="pretraga" th:field="*{pretraga}" type="search" class="form-control" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('pretraga')}">
<div class="mb-3"><label for="vrstaDokumenta" class="form-label">Vrsta dokumenta:</label>
<select id="vrstaDokumenta" th:field="*{vrstaDokumenta}" class="form-select" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('vrstaDokumenta')}">
<option value="">Sve vrste</option>
<option th:each="o : ${vrste}" th:value="${o}" th:text="${o.naziv}"></option>
</select></div>

<div class="mb-3"><label for="status" class="form-label">Status:</label>
<select id="status" th:field="*{status}" class="form-select" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('status')}">
<option value="">Svi statusi</option>
<option th:each="o : ${statusi}" th:value="${o}" th:text="${o.naziv}"></option>
</select></div>

<label for="od" class="form-label">Od datuma zahtjeva:</label><input id="od" th:field="*{od}" type="date" class="form-control" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('od')}">
<label for="doDatuma" class="form-label">Do datuma zahtjeva:</label><input id="doDatuma" th:field="*{doDatuma}" type="date" class="form-control" th:errorclass="is-invalid" th:attr="aria-invalid=${#fields.hasErrors('doDatuma')}">
<ul th:if="${#fields.hasAnyErrors()}" class="text-danger small my-2"><li th:each="greska : ${#fields.allErrors()}" th:text="${greska}"></li></ul>

<button type="submit" class="btn btn-primary">Pretraži</button><a th:href="@{/dokumenti}" class="btn btn-outline-secondary">Prikaži sve</a>
</form>
<p th:if="${dokumenti.isEmpty()}">Nema dokumenata za prikaz.</p>
<div class="table-responsive" tabindex="0" role="region" aria-label="Pregled evidencije"><table class="table table-striped table-hover align-middle" th:unless="${dokumenti.isEmpty()}">
<thead><tr><th scope="col">Primatelj</th><th scope="col">Vrsta</th><th scope="col">Datum zahtjeva</th><th scope="col">Status</th><th scope="col">Datum izdavanja</th><th scope="col">Radnje</th></tr></thead>
<tbody><tr th:each="d : ${dokumenti}">
<td th:text="${d.imePrimatelja + ' ' + d.prezimePrimatelja}"></td>
<td th:text="${d.vrstaDokumenta.naziv}"></td>
<td th:text="${d.datumZahtjeva != null ? #temporals.format(d.datumZahtjeva, 'dd.MM.yyyy.') : '—'}"></td>
<td ><span class="badge" th:classappend="${d.status.name() == 'IZDAN' or d.status.name() == 'SLUZENA' ? 'text-bg-success' : (d.status.name() == 'ODBIJEN' or d.status.name() == 'OTKAZANA' ? 'text-bg-secondary' : 'text-bg-primary')}" th:text="${d.status.naziv}"></span></td>
<td th:text="${d.datumIzdavanja != null ? #temporals.format(d.datumIzdavanja, 'dd.MM.yyyy.') : '—'}"></td>
<td><a th:href="@{/dokumenti/{id}(id=${d.id})}" class="btn btn-outline-primary btn-sm">Detalji</a>
<a th:href="@{/dokumenti/uredi/{id}(id=${d.id})}" class="btn btn-outline-primary btn-sm">Uredi</a></td>
</tr></tbody></table></div>
<p><a th:href="@{/}" class="btn btn-outline-secondary">Povratak na početnu</a></p>
</main>
</body>
</html>
